<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clipcrow — Sign in</title>
<style>
:root{--bg:#10120f;--panel:#181b16;--line:#30342b;--text:#eff1e8;--muted:#a0a697;--accent:#d2f86a;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:var(--bg)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
form{width:100%;max-width:360px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:32px}
.brand{display:flex;align-items:center;gap:6px;font-size:29px;font-weight:800;letter-spacing:-1.5px;margin-bottom:28px}
.brand svg{width:33px;color:var(--accent)}.brand span{color:var(--accent)}
h1{font-size:17px;font-weight:500;margin:0 0 8px;letter-spacing:-.3px}
p.lead{font-size:11px;color:var(--muted);line-height:1.7;margin:0 0 22px}
label{font-size:10px;color:var(--muted);display:block;margin-bottom:8px}
input{width:100%;background:#11140f;border:1px solid var(--line);border-radius:5px;color:var(--text);padding:12px;font-size:13px}
button{width:100%;margin-top:16px;background:var(--accent);color:#202713;border:1px solid var(--accent);border-radius:5px;padding:12px;font-size:13px;font-weight:600;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.error{color:#efb8a7;font-size:11px;margin-top:14px;line-height:1.6}
.foot{font-size:9px;color:#6f7865;margin-top:24px;line-height:1.7}
</style></head><body>
<form id="form">
 <div class="brand"><svg viewBox="0 0 40 40"><path d="M5 9h22l9 10-13-3-3 18-6-13z" fill="currentColor"/><circle cx="26" cy="13" r="1.4" fill="#151713"/></svg>clipcrow<span>/</span></div>
 <h1>Sign in to the desk</h1>
 <p class="lead">This Clipcrow is reachable over the network. A connected YouTube channel can be published to from here, so it is password protected.</p>
 <label for="password">Password</label>
 <input id="password" type="password" autocomplete="current-password" autofocus required>
 <button id="submit" type="submit">Sign in</button>
 <p class="error" id="error" hidden></p>
 <p class="foot">Footage and the YouTube token stay on the server running this app.</p>
</form>
<script type="module">
const form=document.getElementById('form'),error=document.getElementById('error'),submit=document.getElementById('submit');
form.onsubmit=async event=>{
 event.preventDefault();error.hidden=true;submit.disabled=true;submit.textContent='Signing in…';
 try{
  const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(data.error||'That did not work');
  location.href='/';
 }catch(e){error.textContent=e.message;error.hidden=false;document.getElementById('password').select();}
 finally{submit.disabled=false;submit.textContent='Sign in';}
};
</script></body></html>
