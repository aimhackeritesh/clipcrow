<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
:root{--bg:#10120f;--panel:#181b16;--line:#30342b;--text:#eff1e8;--muted:#a0a697;--accent:#d2f86a}
*{box-sizing:border-box}
body{margin:0;width:400px;height:560px;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:13px Arial,Helvetica,sans-serif}
header{display:flex;align-items:center;gap:6px;padding:14px 16px;border-bottom:1px solid var(--line);font-size:17px;font-weight:800;letter-spacing:-.8px}
header svg{width:20px;color:var(--accent)}header span{color:var(--accent)}
header small{margin-left:auto;font:9px monospace;font-weight:400;letter-spacing:1px;color:var(--muted)}
.state{padding:14px 16px;font-size:11px;color:var(--muted);line-height:1.7}
.state a,.state b{color:var(--accent);font-weight:400}
#list{flex:1;overflow-y:auto}
.clip{display:flex;gap:10px;align-items:flex-start;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.clip:hover{background:#1e231a}
.clip input{margin:2px 0 0;accent-color:var(--accent);width:15px;height:15px;flex:none}
.clip.on{background:#242c1a}
.no{font:11px monospace;color:var(--accent);margin-right:7px}
.title{font-size:11px;line-height:1.5;overflow-wrap:anywhere}
.meta{font-size:9px;color:var(--muted);margin-top:5px}
.spoken{font-size:9px;color:#aab398;margin-top:5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
footer{border-top:1px solid var(--line);background:var(--panel);padding:12px 16px}
button{width:100%;font:inherit;font-size:12px;font-weight:600;padding:11px;border-radius:5px;cursor:pointer;background:var(--accent);color:#202713;border:1px solid var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
.note{font-size:10px;color:var(--muted);line-height:1.6;margin:10px 0 0}
.note b{color:var(--text);font-weight:500}
</style></head>
<body>
<header><svg viewBox="0 0 40 40"><path d="M5 9h22l9 10-13-3-3 18-6-13z" fill="currentColor"/></svg>clipcrow<span>/</span><small id="count"></small></header>
<div class="state" id="state">Reading clips from 127.0.0.1:4317…</div>
<div id="list"></div>
<footer>
 <button id="stage" disabled>Stage 0 clips</button>
 <p class="note" id="note">Tick the clips to upload. On <b>studio.youtube.com</b> the Clipcrow bar fills them one at a time; you publish each yourself.</p>
</footer>
<script src="popup.js"></script>
</body></html>
